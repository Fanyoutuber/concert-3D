<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background Wine Gradient -->
    <linearGradient id="wineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B52A40"/>
      <stop offset="45%" stop-color="#8E2032"/>
      <stop offset="100%" stop-color="#4A0C17"/>
    </linearGradient>
    
    <!-- Gold / Rose Accent Gradient -->
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Outer Ring Glow -->
  <circle cx="32" cy="32" r="30.5" fill="url(#wineGrad)" stroke="#FB7185" stroke-width="2.5"/>

  <!-- Inner Subtle Ring -->
  <circle cx="32" cy="32" r="27.5" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="1"/>

  <!-- Phone Call Icon (ALO Symbol) centered and scaled -->
  <g transform="translate(14, 14) scale(1.5)" filter="url(#glow)">
    <!-- Signal waves in Gold/Yellow -->
    <path d="M14.05 2a9 9 0 0 1 8 7.94" stroke="url(#goldAccent)" stroke-width="2" stroke-linecap="round"/>
    <path d="M14.05 6A5 5 0 0 1 18 10" stroke="url(#goldAccent)" stroke-width="2" stroke-linecap="round"/>

    <!-- Handset in White -->
    <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"
          fill="#FFFFFF" stroke="#FFFFFF" stroke-width="0.5" stroke-linejoin="round"/>
  </g>
</svg>
